[workspace]
resolver = "2"
members = ["crates/sp-app", "crates/sp-core", "crates/sp-win"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
gpui-kit = "=0.8.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rust-embed = "8"
regex = "1"
strsim = "0.11"
encoding_rs = "0.8"
time = { version = "0.3", features = ["formatting", "macros"] }
winreg = "0.56"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_Graphics_Dwm",
] }
tempfile = "3"
adb_client = { version = "3.2.3", default-features = false, features = ["usb"] }
raw-window-handle = "0.6"
